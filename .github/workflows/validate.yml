name: Validate

on:
  pull_request:
  push:

env:
  GO111MODULE: on

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  DetermineVersion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: go-version-matrix
        run: |
          go_version="$(awk '/^go/{print $2}' go.mod)"
          echo "go_version=${go_version}.x" >> "$GITHUB_OUTPUT"

          matrix_versions="$(git ls-remote --tags https://github.com/golang/go |
              awk -F/ '$3 ~ /^go[0-9]+\.[0-9]+(\.[0-9]+)?$/{sub(/^go/, "", $3); sub(/\.[0-9]+$/, "", $3); print $3}' |
              sort -uV |
              sed -ne "/^$go_version$/,$ p" |
              jq -cMnR '[inputs | select(length>0)]')"
          echo "matrix=$matrix_versions" >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.go-version-matrix.outputs.matrix }}
      go_version: ${{ steps.go-version-matrix.outputs.go_version }}

  Pre-Commit:
    needs: DetermineVersion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2026.9.0"
          install: true
          cache: true
          experimental: true
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        with:
          extra-args: --all-files --show-diff-on-failure
        env:
          SKIP: >
            gofumpt,
            goimports,
            golangci-lint,
            go-vet,
            gitleaks

  GolangCI-Lint:
    needs: DetermineVersion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2026.9.0"
          install: true
          cache: true
          experimental: true
      - name: Check formatting
        run: golangci-lint fmt --diff
      - name: Run linters
        run: golangci-lint run

  Vet:
    needs: DetermineVersion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2026.9.0"
          install: true
          cache: true
          experimental: true
      - name: Run vet
        run: go vet ./...

  Test:
    needs: DetermineVersion
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJson(needs.DetermineVersion.outputs.matrix) }}
        os: [ ubuntu-latest, macOS-latest, windows-latest ]
    name: ${{ matrix.os }} Go ${{ matrix.go }} Tests
    env:
      MISE_GO_VERSION: ${{ matrix.go }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2026.9.0"
          install: true
          cache: true
          experimental: true
      - name: Run tests
        run: go test -v -cover -race ./...

  gotip:
    needs: DetermineVersion
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2026.9.0"
          install: true
          cache: true
          experimental: true
      - name: Run tests on tip
        run: |
          go install golang.org/dl/gotip@latest
          "$(go env GOPATH)/bin/gotip" download
          "$(go env GOPATH)/bin/gotip" test -race ./...

  renovate-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2026.9.0"
          install: true
          cache: true
          experimental: true
      - name: Validate renovate.json
        run: renovate-config-validator renovate.json

  GoReleaser:
    needs: DetermineVersion
    runs-on: ubuntu-latest
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2026.9.0"
          install: true
          cache: true
          experimental: true
      - name: Allow arm Docker builds
        run: sudo docker run --privileged linuxkit/binfmt:v0.8
      - name: Run GoReleaser
        run: goreleaser release --config .goreleaser.yaml --clean --snapshot --skip=sign
