version: "2"

run:
  timeout: 5m
  go: "1.24"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - revive
    - gocritic
    - misspell
    - copyloopvar
    - intrange
    - errorlint
    - nolintlint
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
    gosec:
      excludes:
        - G304  # file inclusion via variable — expected in CLI with config file args
    revive:
      rules:
        - name: exported
        - name: var-naming
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
    paths:
      - dist

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hoshsadiq/godotenv
